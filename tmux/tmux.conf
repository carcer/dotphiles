# ~/.tmux.conf — managed by dotfiles (tmux/tmux.conf)
# Fresh setup, June 2026. Focus: sane defaults + session persistence.

# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"   # truecolor
set -s escape-time 10                         # snappier ESC
set -g history-limit 50000
set -g display-time 2000                      # status messages linger
set -g focus-events on
set -g mouse on                               # mouse select/resize/scroll

# 1-based, and keep indices tidy when windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- prefix --------------------------------------------------------------------
# C-a instead of C-b (matches your historical setup)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- keybindings ---------------------------------------------------------------

# reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# splits keep the current path; intuitive | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# switch windows with Alt+number (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi-style copy mode; y to yank
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- status bar ----------------------------------------------------------------

set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M "
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# -- plugins (TPM) -------------------------------------------------------------
# Install/update:  prefix + I (install), prefix + U (update)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: also save/restore pane contents and running programs
set -g @resurrect-capture-pane-contents 'on'

# continuum: auto-save every 15 min, auto-restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Manual snapshot: prefix + C-s (save now), prefix + C-r (restore last).
# Saves live in ~/.local/share/tmux/resurrect/ (XDG, not ~/.tmux/resurrect/).
# GOTCHA: declaring these @plugin lines is NOT enough — they must be cloned
# with `prefix + I` (or ~/.tmux/plugins/tpm/bin/install_plugins) before any
# save/restore happens. Sessions are RAM-only until then; a power cut loses them.

# Auto-bootstrap TPM on first launch if it's missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this line LAST
run '~/.tmux/plugins/tpm/tpm'
