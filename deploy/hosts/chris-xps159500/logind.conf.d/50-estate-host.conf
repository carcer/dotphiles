# Installed to /etc/systemd/logind.conf.d/ by deploy/configure-system.sh when
# the host profile sets DOTPHILES_ROLE=host. The XPS runs agent lanes
# unattended, so closing the lid or going idle must never suspend it.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
HandlePowerKey=poweroff
