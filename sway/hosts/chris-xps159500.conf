# Dell XPS 15 9500 (i9, 4K touch) host overrides. Linked to
# ~/.config/sway/host.conf by deploy/linux from the hostname; the shared
# config includes that path. Role: always-on agent host for the estates.
#
# Intel graphics only: the GTX 1650 Ti is left unused (no nvidia packages).
# The output name is validated with `swaymsg -t get_outputs` after install.

output eDP-1 scale 2

input type:touchpad {
    tap enabled
    natural_scroll disabled
    dwt enabled
}

# Keep touch mapped to the built-in panel when an external display is attached.
input type:touch {
    map_to_output eDP-1
}

# Attach a terminal to the persistent Herdr server at login. The server itself
# runs as the herdr-server systemd user unit, so lanes outlive this window.
exec $term --class herdr herdr
