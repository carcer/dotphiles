# Framework Laptop 13 (AMD) host overrides. Linked to ~/.config/sway/host.conf
# by deploy/linux from the hostname; the shared config includes that path.

output eDP-1 scale 2

# Framework touchpad defaults. Device-specific overrides can be added after
# validating `swaymsg -t get_inputs` on the installed system.
input type:touchpad {
    tap enabled
    natural_scroll disabled
    dwt enabled
}
