[Login]
# Handle lid switch behavior
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Ignore inhibitors for lid switch to ensure suspend works
# even when media is playing or other processes request inhibit
LidSwitchIgnoreInhibited=no

# Power button behavior
HandlePowerKey=poweroff
HandleSuspendKey=suspend
HandleHibernateKey=hibernate

# Idle action - let xautolock + custom timer handle screen lock
# We'll configure auto-suspend separately via systemd timer
IdleAction=ignore
IdleActionSec=30min

# Ensure some delay before killing processes on suspend
InhibitDelayMaxSec=5
