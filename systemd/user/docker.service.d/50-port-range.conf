# Rootless Docker on the lane runners: published ports from 20000-29999 instead of
# the host's ephemeral 32768-60999 (see bin/dockerd-port-range). sc-dev-01 already does
# this with its own 10-portband.conf (2026-09-25); this file is for chris-framework. Not linked by
# dotsync on purpose: a Docker restart stops every container, so it is installed
# per host at a safe point agreed with that host's estates:
#   ln -s ~/.dotfiles/systemd/user/docker.service.d ~/.config/systemd/user/docker.service.d
#   systemctl --user daemon-reload && systemctl --user restart docker
[Service]
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=false
Environment=DOCKERD=%h/bin/dockerd-port-range
