[Sleep]
# Suspend mode: s2idle, shallow, deep (s3)
# s2idle = suspend-to-idle (modern, but can have wake issues)
# deep = suspend-to-RAM (traditional S3, more reliable)
# Starting with s2idle - if lid-close issues persist, change to 'deep'
SuspendMode=s2idle

# Hibernate mode
HibernateMode=platform shutdown

# Hybrid sleep settings
HybridSleepMode=suspend platform shutdown
